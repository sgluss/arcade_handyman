[project]
name = "toolsmith"
version = "0.1.0"
description = "An agent that turns an API description into a working, eval-gated Arcade MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arcade-mcp-server>=1.0",
    "anthropic[mcp]>=0.60",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "arcade-mcp[evals]>=1.15.2",
    # runtime dependency: the verify stage lints generated servers
    "ruff>=0.6",
    "python-dotenv>=1.2.2",
]

[project.scripts]
toolsmith = "toolsmith.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolsmith"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
